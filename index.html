<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>当たったら Ver.0.5</title><style>
:root{--i:#183447;--m:#6f7d86;--l:#e7dfd5;--a:#e17f57;--b:#f2b27d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff5e8,#f4f9f9 48%,#f4efe8);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}button,textarea{font:inherit}.app{max-width:540px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 15px 35px}.v{display:none}.v.on{display:block}.top{padding:20px 3px 12px}.ey{font-size:12px;font-weight:900;color:#a76147}.ttl{font-size:31px;font-weight:950;line-height:1.2;letter-spacing:-.04em;margin:8px 0}.lead{color:var(--m);line-height:1.75;font-size:14px}.card,.dream,.done{background:#fff;border:1px solid var(--l);border-radius:25px;padding:18px;box-shadow:0 12px 30px #513d2e18}.money{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mb{background:#fff;border:1px solid var(--l);border-radius:18px;padding:14px;text-align:left}.mb b{font-size:20px}.mb small{display:block;color:var(--m);margin-top:5px}.mb.sel,.dream.sel,.pick.sel{border:2px solid var(--a);background:#fff8f3}.f{margin:15px 0}.f b{display:block;font-size:13px;margin-bottom:6px}.f textarea{width:100%;min-height:70px;border:1px solid var(--l);border-radius:16px;padding:12px;resize:vertical}.btn{width:100%;border:0;border-radius:19px;padding:16px;font-weight:950;background:linear-gradient(90deg,var(--b),var(--a));color:#fff;margin-top:12px}.btn:disabled{opacity:.4}.sub{width:100%;border:0;border-radius:18px;padding:14px;font-weight:850;background:#edf3f4;color:#315567;margin-top:9px}.prog{position:sticky;top:0;background:#fff8efdd;backdrop-filter:blur(8px);margin:0 -15px 10px;padding:10px 15px;border-bottom:1px solid var(--l);font-size:12px;font-weight:900;z-index:3}.world{background:linear-gradient(135deg,#19364a,#397183);color:#fff;border-radius:24px;padding:17px;margin-bottom:12px}.world strong{display:block;font-size:29px;margin:4px 0}.world p{font-size:13px;line-height:1.6;margin:0;opacity:.9}.dream{margin:10px 0}.dream h3{margin:0 0 6px;font-size:18px}.dream p{margin:0;color:var(--m);font-size:13px;line-height:1.65}.row{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:11px;font-weight:900}.cost{background:#fff0e7;color:#9b5941;border-radius:99px;padding:6px 9px}.left{color:#2b6678}.pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.pick{border:1px solid var(--l);background:#fff;border-radius:17px;padding:12px;text-align:left;min-height:78px}.pick b{display:block;font-size:13px}.pick small{color:var(--m);font-size:11px}.sum{background:#19364a;color:#fff;border-radius:20px;padding:15px;margin-top:14px}.sum strong{font-size:23px}.sum span{display:block;color:#bfe4ed;font-weight:900;margin-top:5px}.spec{background:#f5f9f9;border-radius:17px;padding:13px;margin:10px 0}.spec div{font-size:13px;margin:5px 0}.lockgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lock{border:1px solid var(--l);border-radius:16px;padding:12px;min-height:80px;background:#fff}.lock b{display:block}.lock small{color:var(--m)}.pay{background:linear-gradient(135deg,#19364a,#3c7280);color:#fff;border-radius:25px;padding:19px}.pay p{color:#d8e5e9;line-height:1.65;font-size:13px}.price{font-size:34px;font-weight:950}.ghost{background:#ffffff14;border:1px solid #ffffff30;color:#fff}.fb{margin-top:10px;background:#fff;color:var(--i);border-radius:15px;padding:12px;font-size:12px;display:none}.fb.on{display:block}
</style></head><body><main class="app">
<section id="s1" class="v on"><div class="top"><div class="ey">当たったら Ver.0.5</div><div class="ttl">その金額なら、<br>どこまで人生を変える？</div><div class="lead">金額が違えば、同じ願いでも叶え方を変えます。</div></div><div class="card"><div class="ey">STEP 1 / 5</div><h2>当選額を選ぶ</h2><div id="money" class="money"></div><div class="f"><b>真っ先に変えたいこと</b><textarea id="q1" placeholder="仕事を減らしたい、家を広くしたい…"></textarea></div><div class="f"><b>もっと増やしたい時間</b><textarea id="q2" placeholder="家族との時間、一人の時間…"></textarea></div><div class="f"><b>誰と、何を楽しみたい？</b><textarea id="q3" placeholder="家族で長期旅行、親に旅行を…"></textarea></div><div class="f"><b>前から「いつか」と思っていること</b><textarea id="q4" placeholder="広い家、自分の仕事、海外生活…"></textarea></div><button id="go" class="btn">この金額で、私の未来を見る →</button></div></section>
<section id="s2" class="v"><div class="prog">あなたの未来を作っています　STEP 2 / 5</div><div id="world"></div><div class="top"><div class="ey">あなた向けの3つ</div><div class="ttl" style="font-size:27px">最初に叶えるなら、<br>この3つ。</div><div class="lead">「それやりたい」と思うものを1つ選んでください。ここでは終わりません。</div></div><div id="dreams"></div><button id="next" class="btn" disabled>一番ワクワクする未来を深掘りする →</button><button id="back" class="sub">入力をやり直す</button></section>
<section id="s3" class="v"><div class="prog">1つ目の夢を具体化中　STEP 3 / 5</div><div id="builder"></div></section>
<section id="s4" class="v"><div class="prog">最初の夢が完成　STEP 4 / 5</div><div id="complete"></div></section>
<section id="s5" class="v"><div class="prog">あなたの当選後の人生　STEP 5 / 5</div><div id="pay"></div></section>
</main><script>
const A=[{v:1e7,l:'1,000万円',s:'余白を大きく増やす'},{v:1e8,l:'1億円',s:'暮らしを1つ大きく変える'},{v:3e8,l:'3億円',s:'大きな夢を複数叶える'},{v:1e9,l:'10億円',s:'人生そのものを設計する'}];let S={a:3e8,sel:null,b:{}};const y=n=>'¥'+new Intl.NumberFormat('ja-JP').format(n),lab=()=>A.find(x=>x.v===S.a).l,show=id=>{document.querySelectorAll('.v').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');scrollTo(0,0)};
function rm(){money.innerHTML=A.map(x=>`<button class="mb ${x.v===S.a?'sel':''}" data-v="${x.v}"><b>${x.l}</b><small>${x.s}</small></button>`).join('');money.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.a=+b.dataset.v;rm()})}rm();
const kw={house:['家','広い','住まい','部屋','庭'],time:['仕事','減ら','辞め','時間','自由','休み'],travel:['旅行','旅','海外','沖縄','温泉'],family:['家族','子ども','妻','夫','親','両親'],challenge:['事業','仕事を作','起業','挑戦','学び','趣味','開発']};
const D={
10000000:{house:['🏠','今の暮らしを一段上げる住まい改善',3500000,'引っ越し・家具・リフォームで毎日を広く。'],time:['🌅','1年間、仕事をゆるめる',4000000,'週3〜4日にして時間を買う。'],travel:['✈️','長めの家族旅行を3回する',1800000,'1〜2週間の旅を何度か。'],family:['🎁','家族の思い出予算を先に確保',2000000,'旅行・体験・親への贈り物に。'],challenge:['🌱','1年だけ本気で挑戦する',3000000,'学びや小さな事業に時間を使う。']},
100000000:{house:['🏡','6,000万円前後で家族の家を探す',60000000,'広いLDK、子どもの空間、自分の部屋。'],time:['☕','仕事を週3日にして5年間の余白を買う',25000000,'辞め切らず、家族と自分に時間を戻す。'],travel:['🌺','毎年1か月、家族でどこかに暮らす',10000000,'旅行ではなく期間限定の別生活。'],family:['👨‍👩‍👦','家族と親のために2,000万円使う',20000000,'旅行・住環境・支援まで。'],challenge:['💻','3年間、自分の仕事を育てる',18000000,'すぐ稼げるかを気にせず集中する。']},
300000000:{house:['🏡','8,500万円で家族の家を本気で作る',85000000,'30畳LDK、遊び部屋、作業部屋、庭まで。'],time:['🌅','仕事を週2〜3日にして2年間は焦らない',15000000,'家族時間と自分の挑戦を優先する。'],travel:['✈️','家族で1か月、沖縄か海外に暮らす',1800000,'帰る日を急がない旅を本気でやる。'],family:['🎁','家族と両親の「やりたい」をまとめて叶える',15000000,'旅行・贈り物・記念体験を遠慮しない。'],challenge:['🚀','2年間、自分の事業に集中する',20000000,'収益を急がず作りたいものを形に。']},
1000000000:{house:['🏠','自宅＋セカンドハウスの2拠点生活',220000000,'普段の家と「逃げ場所」を両方持つ。'],time:['🕊️','10年間、働くかどうかを自分で決める',120000000,'時間を完全に自分側へ戻す。'],travel:['🌍','毎年3か月、家族で世界のどこかに住む',70000000,'観光ではなく世界で暮らす。'],family:['👨‍👩‍👦','家族の暮らしと将来に1億円置く',100000000,'教育・住まい・親の支援まで。'],challenge:['🏢','自分の会社・プロジェクトを本気で作る',150000000,'人を雇い、数年単位で育てる。']}};
function make(){let t=[q1.value,q2.value,q3.value,q4.value].join(' '),sc={house:0,time:0,travel:0,family:0,challenge:0};for(let k in kw)kw[k].forEach(w=>{if(t.includes(w))sc[k]+=2});let o=Object.keys(sc).sort((a,b)=>sc[b]-sc[a]);if(!sc[o[0]])o=['house','time','travel','family','challenge'];S.p=o.slice(0,3);world.innerHTML=`<div class="world"><small>あなたが選んだ世界</small><strong>${lab()}</strong><p>${S.a===1e7?'生活を全部変えるより、余白を大きく増やす世界。':S.a===1e8?'家・働き方・旅行のどれかを本気で変える世界。':S.a===3e8?'家を買っても仕事を減らしても、まだ次の大きな夢が残る世界。':'何を買うかより、どんな暮らしを設計するかまで考える世界。'}</p></div>`;rd();show('s2')}
function rd(){dreams.innerHTML=S.p.map(k=>{let d=D[S.a][k];return`<div class="dream ${S.sel===k?'sel':''}" data-k="${k}"><h3>${d[0]} ${d[1]}</h3><p>${d[3]}</p><div class="row"><span class="cost">目安 ${y(d[2])}</span><span class="left">叶えても ${y(S.a-d[2])} 残る</span></div></div>`}).join('');dreams.querySelectorAll('.dream').forEach(x=>x.onclick=()=>{S.sel=x.dataset.k;rd();next.disabled=false})}
const B={house:[['住む場所',['今の生活圏','自然の近く','駅近','2拠点']],['絶対ほしい',['広いLDK','子どもの部屋','作業部屋','庭']],['さらに盛る',['ホテル風の風呂','憧れのキッチン','防音室','家具を総入替']]],time:[['働き方',['週4','週3','一度休む','辞めて選び直す']],['増やす時間',['家族の平日','一人時間','旅行','挑戦']],['余白を盛る',['家事代行','月1小旅行','外食予算','作業環境']]],travel:[['旅の形',['沖縄1か月','北海道1か月','海外1か月','国内を転々']],['大事にする',['急がない','家族の体験','食事','宿']],['旅を盛る',['いい宿','レンタカー','親も招く','次の旅も予約']]],family:[['誰に使う',['家族','両親','子ども','みんな']],['何を叶える',['旅行','住まい','思い出','安心']],['さらに盛る',['家族写真','親へ旅行','記念日の食事','子どもの体験']]],challenge:[['挑戦',['小さな事業','学び直し','作品制作','趣味を本気で']],['期間',['1年','2〜3年','人と組む','会社にする']],['環境',['機材','作業場所','外注','取材・旅行']]]};
function build(){S.b={};let d=D[S.a][S.sel],g=B[S.sel];builder.innerHTML=`<div class="card"><div class="ey">${d[0]} ${d[1]}</div><h2>では、ここから本気で具体化。</h2><div id="qs"></div><div class="sum">目安 <strong id="tot">${y(d[2])}</strong><span id="rem">それでも ${y(S.a-d[2])} 残る</span></div><button id="finish" class="btn" disabled>この夢を完成させる →</button><button id="b2" class="sub">別の夢を選ぶ</button></div>`;qs.innerHTML=g.map((x,i)=>`<h3>${x[0]}</h3><div class="pickgrid">${x[1].map((z,j)=>`<button class="pick" data-g="${i}" data-v="${z}"><b>${z}</b><small>これを選ぶ</small></button>`).join('')}</div>`).join('');qs.querySelectorAll('.pick').forEach(p=>p.onclick=()=>{qs.querySelectorAll(`[data-g="${p.dataset.g}"]`).forEach(x=>x.classList.remove('sel'));p.classList.add('sel');S.b[p.dataset.g]=p.dataset.v;finish.disabled=Object.keys(S.b).length<3});finish.onclick=done;b2.onclick=()=>show('s2');show('s3')}
function done(){let d=D[S.a][S.sel];complete.innerHTML=`<div class="done"><div class="ey">最初の夢が完成</div><h2>${d[0]} ${d[1]}</h2><div class="spec">${Object.values(S.b).map(x=>`<div>✓ ${x}</div>`).join('')}</div><h2>${y(d[2])}</h2><div class="lead" style="font-weight:900;color:#2b6678">${lab()}から叶えても、まだ ${y(S.a-d[2])}。</div><p class="lead">ここまで無料。次はこの残りで、別の夢もあなた仕様に作れます。</p><div class="lockgrid"><div class="lock"><b>✈️ 旅行</b><small>次はどこへ？</small></div><div class="lock"><b>🌅 理想の平日</b><small>時間をどう使う？</small></div><div class="lock"><b>🎁 家族</b><small>誰に何を？</small></div><div class="lock"><b>🌱 挑戦</b><small>何を始める？</small></div></div><button id="paygo" class="btn">残りの人生も見てみる →</button></div>`;paygo.onclick=paywall;show('s4')}
function paywall(){pay.innerHTML=`<div class="pay"><div class="ey" style="color:#ffd5bf">あなたの${lab()}ライフは、まだ途中</div><h2>最初の1つは完成。<br>残りも全部、あなた仕様に。</h2><p>旅行・働き方・家族・挑戦・理想の1日まで、選んだ金額のスケールで続きを作ります。</p><div class="price">500円</div><button id="yes" class="btn">500円なら続けたい</button><button id="no" class="sub ghost">今は払わない</button><div id="fb" class="fb"></div><p style="font-size:10px">※ 実際の決済はありません。課金ポイント検証用です。</p></div>`;yes.onclick=()=>f(true);no.onclick=()=>f(false);show('s5')}
function f(v){fb.classList.add('on');fb.innerHTML=v?'<b>続けたいを選びました。</b><br>次は本物のAI接続を検討する価値があります。':'<b>今は払わないを選びました。</b><br>どこでワクワクが足りなかったかを見る材料になります。'}
go.onclick=make;back.onclick=()=>show('s1');next.onclick=build;
</script></body></html>
