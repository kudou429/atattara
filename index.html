<!doctype html>
<html lang="ja">
<head>

<title>当たったら — 会話中心プロトタイプ</title>
<style>
:root{
  --ink:#173544;--muted:#71818a;--paper:#fffdfa;--bg:#f5f1ea;--line:#e7dfd5;
  --navy:#102f40;--navy2:#1d5262;--warm:#ff9463;--gold:#f4c66f;--mint:#e8f4ef;
  --mint2:#cfe9dc;--blue:#eaf4f6;--shadow:0 18px 50px rgba(29,48,60,.11);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#f8f3eb,#eff5f3);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
.app{max-width:820px;margin:auto;min-height:100vh;padding:calc(8px + env(safe-area-inset-top)) 12px calc(24px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 2px 11px;position:sticky;top:0;z-index:30;background:linear-gradient(#f7f2eaf2,#f7f2eadb,transparent);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:9px}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,var(--gold),var(--warm));display:grid;place-items:center;color:#fff;font-weight:950;box-shadow:0 8px 18px #de83583a}.brandtext b{display:block;font-size:13px;letter-spacing:.14em}.brandtext small{display:block;font-size:9px;color:#87949a;margin-top:2px}
.topactions{display:flex;gap:6px}.iconbtn{border:1px solid #e4ddd4;background:#fffefa;border-radius:12px;padding:8px 10px;font-size:11px;font-weight:900;color:#48606b}
.jackpot{background:radial-gradient(circle at 90% 8%,#f5cc7333,transparent 25%),linear-gradient(135deg,var(--navy),var(--navy2));color:white;border-radius:24px;padding:15px 16px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:12px;align-items:center;overflow:hidden;position:relative}.jackpot:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;border:1px solid #ffffff1d;right:-48px;top:-52px}.jpmeta{position:relative;z-index:2}.jpmeta small{font-size:9px;letter-spacing:.12em;color:#cfe3e6;font-weight:900}.jpamount{font-size:28px;line-height:1;font-weight:950;letter-spacing:-.045em;margin:5px 0}.jpsub{font-size:10px;color:#dce9eb}.jpbadge{position:relative;z-index:2;background:#ffffff17;border:1px solid #ffffff22;border-radius:15px;padding:9px 10px;text-align:right}.jpbadge small{font-size:8px;color:#c8dfe3}.jpbadge b{display:block;font-size:14px;margin-top:2px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:10px;align-items:start}.chatcard,.lifepanel{background:rgba(255,253,250,.97);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.chatcard{min-height:620px;display:flex;flex-direction:column;overflow:hidden}.chathead{padding:13px 15px 10px;border-bottom:1px solid #eee7dd;display:flex;justify-content:space-between;align-items:center;gap:10px}.chathead b{font-size:13px}.chathead small{font-size:9px;color:#8a969b}.statusdot{width:8px;height:8px;border-radius:50%;background:#6fb78e;display:inline-block;margin-right:5px;box-shadow:0 0 0 4px #6fb78e1d}
.messages{padding:14px 13px 8px;display:flex;flex-direction:column;gap:11px;min-height:420px;flex:1;overflow:auto;scroll-behavior:smooth}.msg{display:flex;gap:8px;align-items:flex-start;animation:pop .22s ease}@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.msg.me{justify-content:flex-end}.avatar{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;flex:0 0 28px;font-size:13px;font-weight:950}.ai .avatar{background:#173a4b;color:#fff}.bubble{max-width:83%;padding:11px 12px;border-radius:17px;font-size:12px;line-height:1.65;white-space:pre-wrap}.ai .bubble{background:#f2f6f5;border:1px solid #e3ece8;border-top-left-radius:6px}.me .bubble{background:linear-gradient(145deg,#1b4557,#2f6875);color:#fff;border-top-right-radius:6px}.systemnote{margin:0 auto;background:#fff5e9;border:1px solid #f0dfc8;border-radius:99px;padding:6px 9px;font-size:9px;font-weight:900;color:#9a684e}.typing{display:flex;gap:4px;align-items:center;padding:5px 1px}.typing i{width:5px;height:5px;border-radius:50%;background:#78909a;animation:blink .8s infinite}.typing i:nth-child(2){animation-delay:.12s}.typing i:nth-child(3){animation-delay:.24s}@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
.quick{display:flex;gap:6px;overflow-x:auto;padding:0 13px 9px;scrollbar-width:none}.quick::-webkit-scrollbar{display:none}.quick button{flex:0 0 auto;border:1px solid #e6ddd3;background:#fff;border-radius:99px;padding:8px 10px;font-size:10px;font-weight:900;color:#526a74}.quick button:hover{background:#fff6ee;border-color:#efc8b3}.composer{border-top:1px solid #eee6dc;padding:10px;background:#fffdf9}.inputwrap{display:flex;align-items:flex-end;gap:7px;background:#f4f5f2;border:1px solid #e5e4df;border-radius:17px;padding:7px 7px 7px 11px}.inputwrap textarea{border:0;outline:0;background:transparent;resize:none;min-height:35px;max-height:120px;line-height:1.5;flex:1;font-size:12px;padding:7px 0}.send{border:0;border-radius:13px;width:39px;height:39px;background:linear-gradient(145deg,var(--gold),var(--warm));color:#fff;font-size:17px;font-weight:950;box-shadow:0 7px 16px #db825638}.send:disabled{opacity:.4}.composerhint{font-size:8.5px;color:#98a1a5;margin:6px 3px 0}
.lifepanel{padding:13px;position:sticky;top:58px}.lifehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.lifehead b{font-size:12px}.lifehead span{font-size:8px;font-weight:950;color:#9b684f;background:#fff0df;border-radius:99px;padding:5px 7px}.profilebox{background:#f8f5ef;border-radius:16px;padding:10px;margin-bottom:9px}.profilebox small{font-size:8.5px;color:#889398;font-weight:900}.profilebox p{margin:5px 0 0;font-size:9.5px;line-height:1.5;color:#526770}.lifegrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.lifeitem{border:1px solid #e9e2d9;border-radius:16px;background:#fff;padding:9px;min-height:84px;position:relative;overflow:hidden;transition:.25s}.lifeitem.changed{animation:pulse .7s ease}@keyframes pulse{0%{box-shadow:0 0 0 0 #ff946344}50%{box-shadow:0 0 0 7px #ff94631c;border-color:#ffb291}100%{box-shadow:none}}.lifeitem .ico{font-size:18px}.lifeitem b{display:block;font-size:10px;margin:4px 0 2px}.lifeitem small{display:block;font-size:8.5px;line-height:1.35;color:#78888f}.lifeitem.done{background:#f2faf6;border-color:#c8dfd3}.lifeitem.maybe{background:#fff8f2;border-color:#f1d5c2}.moneybox{background:linear-gradient(145deg,#14384a,#2a6170);color:#fff;border-radius:17px;padding:11px;margin-top:8px}.moneybox small{font-size:8px;color:#cae0e4}.moneybox b{display:block;font-size:20px;margin:2px 0}.moneybar{height:5px;background:#ffffff24;border-radius:99px;overflow:hidden;margin-top:7px}.moneybar span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--warm));border-radius:99px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.metric{background:#eef5f3;border-radius:13px;padding:8px}.metric small{font-size:7.5px;color:#708189}.metric b{display:block;font-size:12px;margin-top:2px}.lifebtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.lifebtns button{border:0;border-radius:12px;padding:9px 6px;font-size:9px;font-weight:950}.comparebtn{background:#173e50;color:#fff}.undobtn{background:#edf1f1;color:#536b75}.timeline{margin-top:9px;border-top:1px solid #eee7df;padding-top:8px}.timelinehead{font-size:8.5px;font-weight:950;color:#8b6a59;margin-bottom:6px}.decision{display:flex;gap:6px;margin:5px 0}.decision i{width:7px;height:7px;border-radius:50%;background:#f1a072;margin-top:4px;flex:0 0 7px}.decision div{font-size:8.5px;line-height:1.4;color:#697a82}.decision b{color:#3c5865}
.sheetback{position:fixed;inset:0;background:#102b3a72;backdrop-filter:blur(4px);z-index:60;display:none;padding:18px}.sheetback.on{display:grid;place-items:center}.sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:#fffdfa;border-radius:25px;padding:17px;box-shadow:0 30px 70px #0f283661}.sheettop{display:flex;justify-content:space-between;align-items:center;gap:10px}.sheettop b{font-size:16px}.close{border:0;background:#eef2f1;border-radius:99px;width:31px;height:31px;font-weight:950}.worlds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.world{border:1px solid #e6ded5;border-radius:18px;padding:12px;background:#fff}.world.primary{border:2px solid #ef9f78;background:#fff8f3}.world .wlabel{font-size:8px;font-weight:950;color:#9a684f}.world h3{font-size:14px;margin:5px 0 8px}.worldrow{font-size:9.5px;line-height:1.5;padding:5px 0;border-top:1px solid #f0ebe5}.worldrow:first-of-type{border-top:0}.worldmoney{font-size:19px;font-weight:950;color:#173f51;margin:7px 0}.sheetnote{font-size:9px;line-height:1.55;color:#7c898e;margin:10px 1px 0}.profileform label{display:block;font-size:9px;font-weight:950;color:#6d7c83;margin:10px 0 4px}.profileform input{width:100%;border:1px solid #e4ddd4;background:#fff;border-radius:13px;padding:11px;font-size:11px;outline:0}.saveprofile{width:100%;border:0;border-radius:15px;background:#173d50;color:#fff;padding:12px;font-weight:950;margin-top:13px}
.mobileLife{display:none;position:fixed;right:13px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:35;border:0;border-radius:99px;background:#173d50;color:#fff;padding:10px 13px;font-size:10px;font-weight:950;box-shadow:0 10px 25px #183e5050}.mobileLife span{background:#ff9a67;border-radius:99px;padding:2px 5px;margin-left:4px}
@media(max-width:720px){.layout{display:block}.lifepanel{display:none}.chatcard{min-height:calc(100vh - 155px)}.messages{min-height:360px}.mobileLife{display:block}.app{padding-left:9px;padding-right:9px}.jackpot{border-radius:20px}.chatcard{border-radius:22px}.bubble{max-width:88%}}
@media(max-width:390px){.jpamount{font-size:25px}.jackpot{padding:13px}.worlds{grid-template-columns:1fr}.topactions .iconbtn:nth-child(2){display:none}}
</style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <div class="brand"><div class="logo">当</div><div class="brandtext"><b>当 た っ た ら</b><small>CHAT-FIRST PROTOTYPE</small></div></div>
    <div class="topactions"><button class="iconbtn" id="profileBtn">現在地を編集</button><button class="iconbtn" id="resetBtn">リセット</button></div>
  </div>

  <section class="jackpot">
    <div class="jpmeta"><small>もし、今日当たったら</small><div class="jpamount" id="topAmount">300,000,000円</div><div class="jpsub">夢を選ぶのではなく、今の生活の続きを話す。</div></div>
    <div class="jpbadge"><small>MY LIFE</small><b id="topProgress">0 / 6</b></div>
  </section>

  <div class="layout">
    <section class="chatcard">
      <div class="chathead"><div><span class="statusdot"></span><b>当選後の話をしよう</b></div><small>決めなくてもOK</small></div>
      <div id="messages" class="messages"></div>
      <div id="quick" class="quick"></div>
      <div class="composer">
        <div class="inputwrap"><textarea id="input" rows="1" placeholder="例：まず仕事を週3にしたいかな"></textarea><button id="send" class="send">↑</button></div>
        <div class="composerhint">自由に話してください。会話からMY LIFEが自動で更新されます。</div>
      </div>
    </section>

    <aside id="lifePanel" class="lifepanel"></aside>
  </div>
</main>
<button id="mobileLife" class="mobileLife">MY LIFE <span id="mobileCount">0</span></button>

<div id="sheetBack" class="sheetback"><div id="sheet" class="sheet"></div></div>

<script>
const KEY='atattara_chat_first_v20';
const defaultState=()=>({
  jackpot:300000000,spent:0,
  profile:{work:'介護の仕事を週5',family:'家族3人',project:'CAREVAなど自分のプロジェクト',wish:'家族との時間と自由を増やしたい'},
  work:null,freeWeekdays:0,home:null,travel:null,car:null,project:null,family:null,
  decisions:[],history:[],turn:0
});
let S=load()||defaultState();
const $=s=>document.querySelector(s);
const money=n=>Math.max(0,Math.round(n)).toLocaleString('ja-JP')+'円';
const oku=n=>n>=100000000?(Math.round(n/1000000)/100+'億円'):n>=10000?(Math.round(n/10000).toLocaleString()+'万円'):money(n);
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function remaining(){return Math.max(0,S.jackpot-S.spent)}
function resolvedCount(){return [S.work,S.home,S.travel,S.car,S.project,S.family].filter(Boolean).length}
function scrollChat(){const m=$('#messages');requestAnimationFrame(()=>m.scrollTop=m.scrollHeight)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function addMessage(role,text,saveIt=true){
  const row=document.createElement('div');row.className='msg '+(role==='me'?'me':'ai');
  if(role==='ai') row.innerHTML=`<div class="avatar">当</div><div class="bubble">${esc(text)}</div>`;
  else row.innerHTML=`<div class="bubble">${esc(text)}</div>`;
  $('#messages').appendChild(row);scrollChat();
  if(saveIt){S.history.push({role,text});S.history=S.history.slice(-60);save()}
}
function systemNote(text){const d=document.createElement('div');d.className='systemnote';d.textContent=text;$('#messages').appendChild(d);scrollChat()}
function typing(on){
  $('#typing')?.remove(); if(!on)return;
  const row=document.createElement('div');row.id='typing';row.className='msg ai';row.innerHTML='<div class="avatar">当</div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>';$('#messages').appendChild(row);scrollChat();
}
function setQuick(items=[]){const q=$('#quick');q.innerHTML='';items.forEach(x=>{const b=document.createElement('button');b.textContent=x.label;b.onclick=()=>handleUser(x.text||x.label);q.appendChild(b)})}
function initial(){
  $('#messages').innerHTML='';
  if(S.history?.length){S.history.forEach(m=>addMessage(m.role,m.text,false));setQuick(suggestQuick());return}
  addMessage('ai',`3億円、当たりました。\n\nでも「理想の暮らしを選んで」とは聞きません。\n今の生活の続きとして、まず何したい？\n\nまとまってなくて大丈夫です。`,true);
  setQuick([{label:'仕事を減らしたい',text:'まず仕事を減らしたいかな'},{label:'家族との時間が欲しい',text:'家族との時間を増やしたい'},{label:'家を考えたい',text:'今より広い家も考えたい'},{label:'何もしない時間が欲しい',text:'しばらく何もしないのもありかも'}]);
}
function parseMoneyText(t){
  const s=t.replace(/[,，\s]/g,'');let total=0,matched=false;
  const o=s.match(/(\d+(?:\.\d+)?)億/);if(o){total+=parseFloat(o[1])*100000000;matched=true}
  const m=s.match(/(\d+(?:\.\d+)?)万/);if(m){total+=parseFloat(m[1])*10000;matched=true}
  if(!matched){const y=s.match(/(\d{6,})円?/);if(y){total=parseInt(y[1],10);matched=true}}
  return matched?Math.round(total):null;
}
function pushDecision(type,title,detail,cost=0){
  const prev=JSON.parse(JSON.stringify({work:S.work,freeWeekdays:S.freeWeekdays,home:S.home,travel:S.travel,car:S.car,project:S.project,family:S.family,spent:S.spent,decisions:S.decisions}));
  S.decisions.push({type,title,detail,cost,time:Date.now(),prev});S.decisions=S.decisions.slice(-20);S.spent+=cost;save();
}
function updateWork(mode){
  const map={weekly5:{title:'週5を続ける',free:0},weekly4:{title:'週4にする',free:1},weekly3:{title:'週3にする',free:2},break1y:{title:'1年間休む',free:5},quit:{title:'仕事を辞めて選び直す',free:5}};
  const x=map[mode];if(!x)return;pushDecision('work','働き方',x.title,0);S.work=x.title;S.freeWeekdays=x.free;save();renderLife('work')
}
function infer(text){
  const t=text.trim();const lower=t.toLowerCase();const price=parseMoneyText(t);
  const out={intent:'other',price};
  if(/週\s*3|週三/.test(t)){out.intent='work3';return out}
  if(/週\s*4|週四/.test(t)){out.intent='work4';return out}
  if(/辞め|退職|やめたい|仕事しない/.test(t)){out.intent='quit';return out}
  if(/1年.*休|一年.*休|休職|しばらく休/.test(t)){out.intent='break';return out}
  if(/仕事|働|勤務|職場/.test(t)){out.intent='work';return out}
  if(/旅行|温泉|海外|沖縄|北海道|ホテル|旅館/.test(t)){out.intent='travel';return out}
  if(/車|クルマ|カー|自動車/.test(t)){out.intent='car';return out}
  if(/careva|プロジェクト|事業|副業|開発|作りたい|起業/i.test(t)){out.intent='project';return out}
  if(/家族(?:の話|について|との時間|時間)|家族.*(?:過ご|出かけ)|妻|息子|子ども|子供|夫婦/.test(t)){out.intent='family';return out}
  if(/家|住宅|マンション|戸建|住まい|引っ越/.test(t)){out.intent='home';return out}
  if(/家族/.test(t)){out.intent='family';return out}
  if(/何もしない|休みたい|のんびり|自由|ゆっくり/.test(t)){out.intent='rest';return out}
  if(/suumo|http|www\./i.test(lower)){out.intent='home';return out}
  return out;
}
function responseFor(text,inf){
  const rem=remaining();
  switch(inf.intent){
    case 'work':
      return {text:`やっぱり最初に「仕事」が来ますね。\n\n今の ${S.profile.work} をいきなりゼロにするより、まず週3くらいに落としてみると、平日が週2日戻ります。\n\nその2日を家族と ${S.profile.project} に使う生活、かなり具体的に想像できます。どうします？`,quick:[{label:'週3にする',text:'週3にしてみる'},{label:'週4くらい',text:'まず週4にする'},{label:'1年休んでみる',text:'1年間いったん休む'},{label:'まだ決めない',text:'まだ仕事は決めないで、他のことも考えたい'}]};
    case 'work3':
      updateWork('weekly3');
      return {text:`週3で置きました。\n\nこれだけで、自分で決められる平日が週2日。ざっくり年間約100日増えます。\n\nそして3億円はまだそのままです。\n\nその平日、最初に何へ使いたい？`,quick:[{label:'家族',text:'まずは家族との時間かな'},{label:'CAREVA',text:'CAREVAを進める時間にしたい'},{label:'平日に出かけたい',text:'平日に家族で出かけたい'},{label:'何もしない',text:'何もしない日も欲しい'}]};
    case 'work4':
      updateWork('weekly4');
      return {text:`週4にしました。\n\n週1日だけでも、年間では約50日の平日が戻ります。\n「辞めるほどではないけど、今より自由」はかなり現実的ですね。\n\nその1日、何に使いたいですか？`,quick:[{label:'家族',text:'家族に使いたい'},{label:'CAREVA',text:'CAREVAに使いたい'},{label:'家のこと',text:'家についても考えたい'}]};
    case 'quit':
      updateWork('quit');
      return {text:`「辞める」を仮置きしました。\n\nこれで通勤や勤務日に合わせて住む場所を選ぶ必要がほぼなくなります。家探しの条件まで変わりますね。\n\n${oku(rem)}あるなら、次は「何を買うか」より、朝起きてどんな1日にしたいかを考えたくなります。`,quick:[{label:'家族中心',text:'朝から家族で過ごしたい'},{label:'自分の事業',text:'CAREVAを本気でやってみたい'},{label:'住む場所を変える',text:'仕事に縛られないなら住む場所も考えたい'}]};
    case 'break':
      updateWork('break1y');
      return {text:`1年間、仕事を止める世界にしました。\n\n「一生辞める」は重いけれど、「1年だけ買う」なら3億円に対してかなり小さい選択です。\n\nこの1年を、家族・休息・${S.profile.project}にどう分けたいですか？`,quick:[{label:'家族を最優先',text:'最初の半年は家族を最優先にしたい'},{label:'事業もやる',text:'週2くらいはCAREVAも進めたい'},{label:'まず何もしない',text:'最初の1ヶ月は何もしないで休みたい'}]};
    case 'home':{
      const p=inf.price;
      if(p && p>1000000){
        const label=(text.match(/(?:家|住宅|マンション|戸建)[^、。\n]{0,20}/)||['気になっている家'])[0];
        pushDecision('home','住まい',label,p);S.home={label,price:p};save();renderLife('home');
        return {text:`その家をMY LIFEに入れました。\n\n購入額は ${oku(p)}。残りは約 ${oku(remaining())}。\n\nここが普通の物件検索と違うところです。この家を選んだ状態で、仕事・旅行・車まで全部考え続けられます。\n\nこの家に住むなら、働き方は今のままにします？`,quick:[{label:'週3にしたい',text:'この家なら仕事は週3にしたい'},{label:'仕事は今のまま',text:'家を買っても仕事は今のままにする'},{label:'旅行もしたい',text:'この家に住みつつ旅行も増やしたい'}]};
      }
      return {text:`家も考えたいですよね。\n\nでも「豪邸が欲しい？」より、今の暮らしで何を消したいかの方が自分事になりそうです。\n\nたとえば、広さ・自分の作業部屋・息子が遊べる場所・庭。どれが一番欲しい？\n\nSUUMOなどで気になる家があれば「1億2800万のこの家いい」とそのまま書いても大丈夫です。`,quick:[{label:'作業部屋',text:'自分の作業部屋は欲しい'},{label:'子どもの遊び場',text:'息子が遊べる広さが欲しい'},{label:'庭',text:'庭のある家がいい'},{label:'今の生活圏',text:'生活圏はあまり変えたくない'}]};
    }
    case 'travel':
      if(!S.travel){pushDecision('travel','旅行','平日に家族旅行を増やす',3000000);S.travel={label:'平日に家族旅行を増やす',budget:3000000};save();renderLife('travel')}
      return {text:`旅行をMY LIFEに入れました。ひとまず年間300万円の「旅行枠」で置いています。\n\n${S.freeWeekdays>=2?'週3勤務なら、土日に合わせなくても出発できます。混雑を避けて平日に1〜2泊、という生活がかなり現実的です。':'働き方も少し減らすと、旅の自由度が一気に上がりそうです。'}\n\n行く回数を増やしたい？ それとも1回を豪華にしたい？`,quick:[{label:'回数を増やす',text:'平日にちょこちょこ旅行したい'},{label:'長く滞在したい',text:'年に1回は1ヶ月くらい旅したい'},{label:'海外も行きたい',text:'海外旅行も増やしたい'}]};
    case 'car':
      if(inf.price&&inf.price>100000){pushDecision('car','車',`欲しい車 ${oku(inf.price)}`,inf.price);S.car={label:`欲しい車 ${oku(inf.price)}`,price:inf.price};save();renderLife('car')}
      else if(!S.car){pushDecision('car','車','欲しい車を検討中',0);S.car={label:'欲しい車を検討中',price:0};save();renderLife('car')}
      return {text:`車もMY LIFEに追加しました。\n\n今は「車単体」ではなく、家の駐車場や旅行の仕方と一緒に考えたいです。\n${S.home?'家がもう決まっているので、次はその家に置きたい車として考えられます。':'家を先に決めると、駐車場や生活圏から車の選び方も変わります。'}\n\n具体的な車名や価格があれば、そのまま話してください。`,quick:[{label:'家族で使いやすい車',text:'家族で遠出しやすい車がいい'},{label:'憧れの車',text:'せっかくなら憧れの車も欲しい'},{label:'家を先に決める',text:'車より家を先に考えたい'}]};
    case 'project':
      if(!S.project){pushDecision('project','挑戦',S.profile.project+'に時間を使う',0);S.project={label:S.profile.project+'に時間を使う'};save();renderLife('project')}
      return {text:`ここはかなり「あなたの当たったら」ですね。\n\n${S.profile.project} を、生活費のためではなく「やってみたいからやる」に変えられます。\n${S.freeWeekdays>=2?'週3勤務なら、週2日の固定枠を作っても家族時間を残せます。':'仕事を少し減らすだけでも、毎週まとまった時間を確保できます。'}\n\n売上を急がず1年試す、という選択もできます。`,quick:[{label:'週2日やる',text:'週2日はCAREVAに使いたい'},{label:'1年試したい',text:'1年間は売上を気にせず試したい'},{label:'家族時間を先に',text:'でも家族時間を優先したい'}]};
    case 'family':
      if(!S.family){pushDecision('family','家族時間','平日の家族時間を増やす',0);S.family={label:'平日の家族時間を増やす'};save();renderLife('family')}
      return {text:`「家族との時間」をMY LIFEの中心に置きました。\n\n${S.freeWeekdays>=2?`週3勤務なら、年間約${S.freeWeekdays*50}日の平日を自分たちで使えます。`:'今の週5を少し減らすだけでも、平日の家族時間を作れます。'}\n\n土日の混雑を避けて出かけたり、何でもない平日に一緒に昼ごはんを食べたり。大きな買い物より、こういう変化の方が「3億円が入った自分の生活」っぽい気がします。`,quick:[{label:'平日に出かける',text:'平日に家族で出かけたい'},{label:'家も広くしたい',text:'家族3人でもっと広く暮らしたい'},{label:'旅行',text:'家族旅行も増やしたい'}]};
    case 'rest':
      return {text:`それもかなり大事だと思います。\n\n3億円当たったら、すぐ「何か始めなきゃ」じゃなくていい。\n朝起きて、仕事に行かず、Macも開かず、予定も入れない日を作れる。\n\nまず1ヶ月だけ何もしない、という世界も置いてみます？`,quick:[{label:'1ヶ月休む',text:'最初の1ヶ月は何もしないで休む'},{label:'週3だけにする',text:'完全に休むより週3勤務かな'},{label:'家族で過ごす',text:'休むなら家族で過ごしたい'}]};
    default:
      return contextFallback(text);
  }
}
function contextFallback(text){
  if(/作業部屋|書斎/.test(text)){return {text:`それ、かなり具体的です。\n\n「豪邸」ではなく、自分の作業部屋があるだけで、今の生活からの差がはっきりします。\n家族の生活空間と、自分が${S.profile.project}を進める場所を分けられる家。\n\nこの条件で家をMY LIFEに追加しておきます。`,after:()=>{pushDecision('home','住まい','自分の作業部屋がある広い家',80000000);S.home={label:'自分の作業部屋がある広い家',price:80000000};save();renderLife('home')},quick:[{label:'今の生活圏で',text:'今の生活圏は変えずに探したい'},{label:'庭も欲しい',text:'庭も欲しい'},{label:'仕事も減らす',text:'その家なら仕事も減らしたい'}]}}
  if(/1ヶ月|一ヶ月/.test(text)&&/休/.test(text)){return {text:`最初の1ヶ月を「空白」にしました。\n\n何も決めず、仕事から離れて、家族と過ごして、疲れていたら寝る。\n3億円の使い道は、そのあと考えても遅くありません。\n\n1ヶ月後、最初に考えたいのは仕事・家・旅行のどれですか？`,quick:[{label:'仕事',text:'1ヶ月休んだら働き方を考えたい'},{label:'家',text:'1ヶ月休んだら家を考えたい'},{label:'旅行',text:'家族旅行に行きたい'}]}}
  return {text:`いいですね。今の話はまだ無理に「決定」にしません。\n\nこのアプリでは、話したことを全部すぐ選択肢に固定せず、「検討中」のまま置けるようにしたいです。\n\n今の話から広げるなら、仕事・家族・家・旅行・自分の挑戦のどこにつなげたい？`,quick:[{label:'仕事',text:'仕事の話をしたい'},{label:'家族',text:'家族の話をしたい'},{label:'家',text:'家の話をしたい'},{label:'自分の挑戦',text:'CAREVAの話をしたい'}]};
}
async function handleUser(text){
  text=(text||'').trim();if(!text)return;
  $('#input').value='';autoGrow();setQuick([]);addMessage('me',text,true);S.turn++;save();typing(true);
  const inf=infer(text);const res=responseFor(text,inf);
  await new Promise(r=>setTimeout(r,Math.min(850,360+text.length*7)));
  typing(false);if(res.after)res.after();addMessage('ai',res.text,true);setQuick(res.quick||suggestQuick());renderLife();
}
function suggestQuick(){
  const a=[];if(!S.work)a.push({label:'仕事を減らしたい',text:'仕事を減らしたい'});if(!S.family)a.push({label:'家族時間',text:'家族との時間を増やしたい'});if(!S.home)a.push({label:'家',text:'家について考えたい'});if(!S.project)a.push({label:'CAREVA',text:'CAREVAを進めたい'});if(S.work&&!S.travel)a.push({label:'旅行',text:'旅行も増やしたい'});return a.slice(0,4)
}
function renderLife(changed){
  const rem=remaining(),count=resolvedCount();$('#topAmount').textContent=money(S.jackpot);$('#topProgress').textContent=`${count} / 6`;$('#mobileCount').textContent=count;
  const cells=[
    ['home','🏡','住まい',S.home?.label||'まだ決めていない',!!S.home],
    ['work','💼','仕事',S.work||'まだ決めていない',!!S.work],
    ['family','👨‍👩‍👦','家族',S.family?.label||'今の暮らしの続き',!!S.family],
    ['travel','✈️','旅行',S.travel?.label||'まだ決めていない',!!S.travel],
    ['car','🚗','車',S.car?.label||'まだ決めていない',!!S.car],
    ['project','🌱','挑戦',S.project?.label||S.profile.project,!!S.project]
  ];
  $('#lifePanel').innerHTML=`<div class="lifehead"><b>MY LIFE</b><span>会話から自動更新</span></div>
    <div class="profilebox"><small>今の自分</small><p>${esc(S.profile.work)} ／ ${esc(S.profile.family)}<br>${esc(S.profile.wish)}</p></div>
    <div class="lifegrid">${cells.map(c=>`<div class="lifeitem ${c[4]?'done':''} ${changed===c[0]?'changed':''}"><div class="ico">${c[1]}</div><b>${c[2]}</b><small>${esc(c[3])}</small></div>`).join('')}</div>
    <div class="moneybox"><small>残っているお金</small><b>${oku(rem)}</b><div class="moneybar"><span style="width:${Math.max(2,rem/S.jackpot*100)}%"></span></div></div>
    <div class="metrics"><div class="metric"><small>自分で決める平日</small><b>+${S.freeWeekdays*50}日/年</b></div><div class="metric"><small>週の自由平日</small><b>+${S.freeWeekdays}日</b></div></div>
    <div class="lifebtns"><button class="comparebtn" onclick="openCompare()">別の人生と比較</button><button class="undobtn" onclick="undoLast()">1つ戻す</button></div>
    <div class="timeline"><div class="timelinehead">これまでの決定</div>${S.decisions.length?S.decisions.slice(-5).reverse().map(d=>`<div class="decision"><i></i><div><b>${esc(d.title)}</b><br>${esc(d.detail)}</div></div>`).join(''):'<div style="font-size:8.5px;color:#89969b">まだ何も決めていません</div>'}</div>`;
}
function openCompare(){
  const alt=makeAlt();const current={work:S.work||'未定',home:S.home?.label||'今のまま',travel:S.travel?.label||'未定',project:S.project?.label||'未定',rem:remaining(),free:S.freeWeekdays*50};
  openSheet(`<div class="sheettop"><b>2つの「当たったら」</b><button class="close" onclick="closeSheet()">×</button></div>
  <div class="worlds"><div class="world primary"><div class="wlabel">いま話している世界</div><h3>あなたの現在ルート</h3><div class="worldmoney">${oku(current.rem)}</div><div class="worldrow">💼 ${esc(current.work)}</div><div class="worldrow">🏡 ${esc(current.home)}</div><div class="worldrow">✈️ ${esc(current.travel)}</div><div class="worldrow">🌱 ${esc(current.project)}</div><div class="worldrow">📅 自由平日 +${current.free}日/年</div></div>
  <div class="world"><div class="wlabel">もし違う選択なら</div><h3>${esc(alt.title)}</h3><div class="worldmoney">${oku(alt.rem)}</div><div class="worldrow">💼 ${esc(alt.work)}</div><div class="worldrow">🏡 ${esc(alt.home)}</div><div class="worldrow">✈️ ${esc(alt.travel)}</div><div class="worldrow">🌱 ${esc(alt.project)}</div><div class="worldrow">📅 自由平日 +${alt.free}日/年</div></div></div>
  <p class="sheetnote">チャットだけだと流れてしまう「別の人生」を、いつでも横並びで見られるのがこのアプリ側の役目です。</p>`)
}
function makeAlt(){
  if(S.home){return {title:'家は今のまま、時間を買う',rem:S.jackpot-(S.travel?.budget||0)-(S.car?.price||0),work:'1年間いったん休む',home:'今の住まいを維持',travel:'平日旅行を増やす',project:S.profile.project+'を1年試す',free:250}}
  if(S.work==='週3にする'){return {title:'仕事は週5、資産を多く残す',rem:S.jackpot-S.spent,work:'週5を続ける',home:S.home?.label||'今のまま',travel:S.travel?.label||'必要な時だけ',project:'休日に少しずつ',free:0}}
  return {title:'最初の1年を完全に休む',rem:S.jackpot-S.spent,work:'1年間休む',home:S.home?.label||'今のまま',travel:'家族で平日に出かける',project:'急がず考える',free:250}
}
function undoLast(){
  const d=S.decisions.at(-1);if(!d){systemNote('戻せる決定はまだありません');return}
  const p=d.prev;Object.assign(S,{work:p.work,freeWeekdays:p.freeWeekdays,home:p.home,travel:p.travel,car:p.car,project:p.project,family:p.family,spent:p.spent,decisions:p.decisions});save();renderLife();addMessage('ai',`「${d.detail}」をいったん戻しました。\n決め直してもいいし、そのまま別の話をしても大丈夫です。`,true);setQuick(suggestQuick())
}
function openProfile(){openSheet(`<div class="sheettop"><b>今の自分を編集</b><button class="close" onclick="closeSheet()">×</button></div><div class="profileform"><label>今の仕事</label><input id="pfWork" value="${esc(S.profile.work)}"><label>家族</label><input id="pfFamily" value="${esc(S.profile.family)}"><label>自分のプロジェクト・やりたいこと</label><input id="pfProject" value="${esc(S.profile.project)}"><label>今いちばん変えたいこと</label><input id="pfWish" value="${esc(S.profile.wish)}"><button class="saveprofile" onclick="saveProfile()">この現在地で話す</button></div><p class="sheetnote">ここを変えると、会話で使う言葉やMY LIFEの表示も変わります。</p>`)}
function saveProfile(){S.profile.work=$('#pfWork').value.trim()||S.profile.work;S.profile.family=$('#pfFamily').value.trim()||S.profile.family;S.profile.project=$('#pfProject').value.trim()||S.profile.project;S.profile.wish=$('#pfWish').value.trim()||S.profile.wish;save();renderLife();closeSheet();addMessage('ai',`現在地を更新しました。\n「${S.profile.wish}」を前提に、続きを話しましょう。`,true);setQuick(suggestQuick())}
function openMobileLife(){openSheet(`<div class="sheettop"><b>MY LIFE</b><button class="close" onclick="closeSheet()">×</button></div><div id="mobileLifeContent"></div>`);const tmp=$('#lifePanel').cloneNode(true);tmp.style.display='block';tmp.style.position='static';tmp.style.boxShadow='none';tmp.style.border='0';tmp.style.padding='0';$('#mobileLifeContent').appendChild(tmp)}
function openSheet(html){$('#sheet').innerHTML=html;$('#sheetBack').classList.add('on')}
function closeSheet(){$('#sheetBack').classList.remove('on')}
function resetAll(){if(!confirm('このMY LIFEと会話をリセットしますか？'))return;localStorage.removeItem(KEY);S=defaultState();renderLife();initial()}
function autoGrow(){const x=$('#input');x.style.height='auto';x.style.height=Math.min(120,x.scrollHeight)+'px'}
$('#send').onclick=()=>handleUser($('#input').value);$('#input').addEventListener('input',autoGrow);$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleUser($('#input').value)}});$('#profileBtn').onclick=openProfile;$('#resetBtn').onclick=resetAll;$('#mobileLife').onclick=openMobileLife;$('#sheetBack').addEventListener('click',e=>{if(e.target.id==='sheetBack')closeSheet()});
window.openCompare=openCompare;window.undoLast=undoLast;window.closeSheet=closeSheet;window.saveProfile=saveProfile;
renderLife();initial();
</script>
</body>
</html>
