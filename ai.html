<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102f40">
<title>当たったら — AI版</title>
<link rel="stylesheet" href="/ai.css">
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">当</div><div><b>当 た っ た ら</b><small>AI LIFE CONVERSATION</small></div></div>
    <button id="profileBtn" class="ghost">現在地を編集</button>
  </header>

  <section class="jackpot">
    <div><small>もし、今日当たったら</small><div id="jackpotText" class="amount">300,000,000円</div><p>会話しているだけで、横の「自分の未来」が育っていきます。</p></div>
    <select id="jackpotSelect" aria-label="当選額">
      <option value="10000000">1,000万円</option>
      <option value="100000000">1億円</option>
      <option value="300000000" selected>3億円</option>
      <option value="1000000000">10億円</option>
    </select>
  </section>

  <div class="layout">
    <section class="chatcard">
      <div class="chathead">
        <div><span class="dot"></span><b>本物のAIと話す</b></div>
        <small>決めなくてもOK</small>
      </div>
      <div id="messages" class="messages"></div>
      <div id="quick" class="quick"></div>
      <div class="composer">
        <div class="inputwrap">
          <textarea id="input" rows="1" maxlength="800" placeholder="例：まず仕事を少し減らしたいかな"></textarea>
          <button id="send" class="send" aria-label="送信">↑</button>
        </div>
        <div class="hint">自由に話してください。AIが会話とMY LIFEの更新を同時に行います。</div>
      </div>
    </section>

    <aside id="lifePanel" class="lifepanel"></aside>
  </div>
</main>

<button id="mobileLife" class="mobileLife">MY LIFE <span id="mobileCount">0</span></button>

<div id="modalBack" class="modalBack" aria-hidden="true">
  <div id="modal" class="modal"></div>
</div>

<script src="/ai.js"></script>
</body>
</html>
